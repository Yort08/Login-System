<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Dashboard</h1>
      <p class="subtitle">You have successfully signed in.</p>

      <div class="user-badge">
        <div id="welcomeName" class="user-name">Loading...</div>
        <div id="welcomeEmail" class="user-email">Please wait</div>
      </div>

      <button onclick="logout()" class="btn-primary" style="margin-bottom: 0;">Logout</button>
    </main>

    <script>
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "index.html";
      }

      fetch("/api/profile", {
        headers: {
          Authorization: `Bearer ${token}`
        }
      })
      .then(response => {
        if (!response.ok) throw new Error("Unauthorized");
        return response.json();
      })
      .then(data => {
        document.getElementById("welcomeName").textContent = data.user.name;
        document.getElementById("welcomeEmail").textContent = data.user.email;
      })
      .catch(() => {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      });

      function logout() {
        localStorage.removeItem("token");
        window.location.href = "index.html";
      }
    </script>
  </body>
</html>
